<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>VMS Docs - Recebidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="panel-body" onload="bootPage(); loadInbox();">
  <div class="bg-grid"></div>

  <div class="layout">
    <aside class="sidebar glass-card">
      <div class="sidebar-brand">
        <div class="brand-badge small">VMS</div>
        <div>
          <h2>VMS Docs</h2>
          <p>Gestão documental</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Documentos</a>
        <a href="upload.html">Enviar Documento</a>
        <a href="categories.html">Categorias</a>
        <a href="folders.html">Todos Documentos</a>
        <a href="users.html">Usuários</a>
        <a class="active" href="inbox.html">Recebidos</a>
        <a href="send.html">Encaminhar</a>
        <a href="audit.html">Auditoria</a>
      </nav>

      <button class="btn-danger full" onclick="logout()">Sair</button>
    </aside>

    <main class="content">
      <header class="topbar glass-bar">
        <div>
          <h1>Caixa de Recebidos</h1>
          <p>Documentos enviados para o usuário autenticado</p>
        </div>
      </header>

      <section class="glass-card">
        <div class="table-wrapper">
          <table class="modern-table" id="inboxTable">
            <thead>
              <tr>
                <th>Documento</th>
                <th>Remetente</th>
                <th>Status</th>
                <th>Enviado em</th>
                <th>Lido em</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
</body>
</html>
