<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>VMS Docs - Categorias</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="panel-body" onload="initCategoriesPage()">
  <div class="bg-grid"></div>

  <div class="layout">
    <aside class="sidebar glass-card">
      <div class="sidebar-brand">
        <div class="brand-badge small">VMS</div>
        <div>
          <h2>VMS Docs</h2>
          <p>Gestão documental</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Documentos</a>
        <a href="upload.html">Enviar Documento</a>
        <a class="active" href="categories.html">Categorias</a>
        <a href="folders.html">Todos Documentos</a>
        <a href="users.html">Usuários</a>
        <a href="inbox.html">Recebidos</a>
        <a href="send.html">Encaminhar</a>
        <a href="audit.html">Auditoria</a>
      </nav>

      <button class="btn-danger full" onclick="logout()">Sair</button>
    </aside>

    <main class="content">
      <header class="topbar glass-bar">
        <div>
          <h1>Categorias</h1>
          <p>Cadastro e listagem de categorias</p>
        </div>
      </header>

      <section class="grid-2">
        <div class="glass-card form-card" id="categoryFormCard">
          <h3>Nova Categoria</h3>

          <div class="form-group">
            <label for="categoryName">Nome</label>
            <input id="categoryName" placeholder="Ex.: Ofícios">
          </div>

          <div class="form-group">
            <label for="categoryDescription">Descrição</label>
            <input id="categoryDescription" placeholder="Descrição da categoria">
          </div>

          <button class="btn-primary full" onclick="createCategory()">Cadastrar</button>
          <p id="categoryMsg" class="form-message"></p>
        </div>

        <div class="glass-card">
          <h3>Lista de Categorias</h3>
          <div class="table-wrapper">
            <table class="modern-table" id="categoriesTable">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Descrição</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
</body>
</html>
