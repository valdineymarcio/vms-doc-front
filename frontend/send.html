<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>VMS Docs - Encaminhar</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="panel-body" onload="initSendPage()">
  <div class="bg-grid"></div>

  <div class="layout">
    <aside class="sidebar glass-card">
      <div class="sidebar-brand">
        <div class="brand-badge small">VMS</div>
        <div>
          <h2>VMS Docs</h2>
          <p>Gestão documental</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Documentos</a>
        <a href="folders.html">Por Categoria</a>
        <a href="upload.html">Enviar Documento</a>
        <a href="categories.html">Categorias</a>
        <a href="users.html">Usuários</a>
        <a href="inbox.html">Recebidos</a>
        <a class="active" href="send.html">Encaminhar</a>
        <a href="audit.html">Auditoria</a>
      </nav>

      <button class="btn-danger full" onclick="logout()">Sair</button>
    </aside>

    <main class="content">
      <header class="topbar glass-bar">
        <div>
          <h1>Encaminhar Documento</h1>
          <p>Visualize, assine e encaminhe o documento na mesma tela</p>
        </div>
      </header>

      <section class="glass-card form-card">
        <div class="form-group">
          <label for="sendDocumentId">Documento</label>
          <select id="sendDocumentId"></select>
        </div>

        <div class="form-group">
          <label for="sendReceiverId">Destinatário</label>
          <select id="sendReceiverId"></select>
        </div>

        <div class="action-row">
          <button class="btn-secondary" type="button" onclick="previewSelectedDocumentForSend()">Visualizar</button>
          <button class="btn-primary" type="button" onclick="prepareOwnDocumentSignature()">Assinar</button>
          <button class="btn-primary" type="button" onclick="sendDocumentToUser()">Encaminhar</button>
        </div>

        <p id="sendMsg" class="form-message"></p>
      </section>

      <section class="glass-card viewer-card">
        <div class="viewer-toolbar">
          <div>
            <h3 id="sendViewerTitle">Visualização do documento</h3>
            <p id="sendViewerInfo" class="muted-text">Selecione um documento para visualizar ou assinar.</p>
          </div>
          <div class="action-row">
            <button class="btn-primary" id="confirmOwnSignBtn" type="button" onclick="confirmEmbeddedSignature()" disabled>Confirmar assinatura</button>
            <button class="btn-secondary" type="button" onclick="clearEmbeddedViewer()">Fechar visualização</button>
          </div>
        </div>

        <div id="embeddedPdfContainer" class="pdf-container"></div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
</body>
</html>
