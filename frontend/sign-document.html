<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Assinar Documento</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
</head>
<body class="panel-body" onload="initSignPage()">
  <div class="bg-grid"></div>

  <div class="layout">
    <aside class="sidebar glass-card">
      <div class="sidebar-brand">
        <div class="brand-badge small">VMS</div>
        <div>
          <h2>VMS Docs</h2>
          <p>Gestão documental</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Documentos</a>
        <a href="folders.html">Por Categoria</a>
        <a href="upload.html">Enviar Documento</a>
        <a href="categories.html">Categorias</a>
        <a href="users.html">Usuários</a>
        <a href="inbox.html">Recebidos</a>
        <a href="send.html">Encaminhar</a>
        <a href="audit.html">Auditoria</a>
      </nav>

      <button class="btn-danger full" onclick="logout()">Sair</button>
    </aside>

    <main class="content">
      <header class="topbar glass-bar">
        <div>
          <h1>Assinar Documento</h1>
          <p>Clique no local desejado para posicionar a assinatura</p>
        </div>
      </header>

      <section class="glass-card">
        <div class="signature-toolbar">
          <button class="btn-primary" onclick="confirmSignature()">Confirmar Assinatura</button>
          <span id="signInfo" class="muted-text">Clique no PDF para escolher a posição.</span>
        </div>

        <div id="pdfContainer" class="pdf-container"></div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
</body>
</html>
