<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar · VMS Docs</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-card glass-card">
        <a class="auth-brand" href="index.html">
          <span class="brand-badge small">V</span>VMS Docs</a>
        <p class="eyebrow">BEM-VINDO DE VOLTA</p>
        <h1>Acesse seus documentos</h1>
        <p class="auth-description">Envie, acompanhe e assine em um só lugar.</p>
        <form onsubmit="event.preventDefault(); login()">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required autocomplete="username" placeholder="nome@empresa.com">
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Sua senha">
          </div>
          <p id="msg" class="form-message" role="status" aria-live="polite"></p>
          <button type="submit" class="btn-primary full">Entrar</button>
        </form>
        <p class="auth-footnote">Use os dados de acesso fornecidos pelo administrador.</p>
      </section>
      <p class="auth-caption">VMS Docs · Gestão de documentos</p>
    </main>
    <script src="js/api.js"></script>
  </body>
</html>
