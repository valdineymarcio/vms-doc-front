<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>VMS Docs - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="bg-grid"></div>

  <main class="auth-wrapper">
    <section class="glass-card auth-card">
      <div class="brand-block">
        <div class="brand-badge">VMS</div>
        <h1>VMS Docs</h1>
        <p>Sistema de Gestão de Documentos</p>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="Digite seu e-mail">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Digite sua senha">
      </div>

      <button class="btn-primary full" onclick="login()">Entrar</button>
      <p id="msg" class="form-message"></p>
    </section>
  </main>

  <script src="js/api.js"></script>
</body>
</html>
