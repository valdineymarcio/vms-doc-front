<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Primeiro acesso · VMS Docs</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("vmsdocs-theme") === "dark" ? "dark" : "light";</script>
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-card glass-card">
        <a class="auth-brand" href="index.html">
          <span class="brand-badge small">V</span>VMS Docs</a>
        <p class="eyebrow">CONFIGURAÇÃO INICIAL</p>
        <h1>Crie o administrador</h1>
        <p class="auth-description">Disponível apenas enquanto o sistema não tem um administrador.</p>
        <form onsubmit="event.preventDefault(); createAdmin()">
          <div class="form-group">
            <label for="name">Nome</label>
            <input id="name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" type="password" minlength="6" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password">
          </div>
          <div id="msg" role="status" class="form-message"></div>
          <button type="submit" class="btn-primary full" id="btnCreate">Criar administrador</button>
        </form>
        <a class="auth-back" href="index.html">Voltar para entrar</a>
      </section>
    </main>
    <script>

    const API =
        "http://localhost:8080";


    async function createAdmin() {

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const msg =
            document.getElementById("msg");


        const button =
            document.getElementById("btnCreate");


        msg.innerText = "";

        msg.className = "";


        if (
            !name ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            msg.innerText =
                "Preencha todos os campos.";

            msg.className =
                "error";

            return;
        }


        if (
            password.length < 6
        ) {

            msg.innerText =
                "A senha deve ter pelo menos 6 caracteres.";

            msg.className =
                "error";

            return;
        }


        if (
            password !== confirmPassword
        ) {

            msg.innerText =
                "As senhas não são iguais.";

            msg.className =
                "error";

            return;
        }


        button.disabled = true;

        button.innerText =
            "Criando administrador...";


        try {

            const response =
                await fetch(
                    API + "/api/auth/setup-admin",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            password: password

                        })

                    }
                );


            if (!response.ok) {

                let message =
                    "Erro ao criar administrador.";


                try {

                    const data =
                        await response.json();


                    if (data.detail) {

                        message =
                            data.detail;

                    } else if (data.message) {

                        message =
                            data.message;
                    }

                } catch (e) {

                    const text =
                        await response.text();

                    if (text) {

                        message = text;
                    }
                }


                throw new Error(message);
            }


            msg.innerText =
                "Administrador criado com sucesso!";

            msg.className =
                "success";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1500);


        } catch (error) {

            console.error(error);

            msg.innerText =
                error.message;

            msg.className =
                "error";

        } finally {

            button.disabled =
                false;

            button.innerText =
                "Criar Administrador";
        }
    }

</script>
  </body>
</html>
